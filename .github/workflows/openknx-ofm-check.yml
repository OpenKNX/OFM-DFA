name: openknx-ofm-check
run-name: Check OpenKNX OFM Build
on: [push]
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: OAM-StateEngine
            knxprod_xml: StateEngine-DFA16-Release
            build_target: DFA16-Release
          # - variant: DEV (DFA16)
          #   knxprod_xml: StateEngine
          #   build_target: ""
    steps:
      # DO this after restore the use current commit
      # - uses: actions/checkout@v4
      #   with:
      #     path: OFM-DFA

      - name: Check for Same Name Branch in Reference OAM
        id: oam_branch
        run: |
          BRANCH="v1dev"
          EXISTS=$(git ls-remote --heads https://github.com/openknx/${{ matrix.variant }}.git ${{ github.ref_name }} | wc -l)
          if [ "$EXISTS" -gt 0 ]; then
            BRANCH="${{ github.ref_name }}"
          fi
          echo "ref_name=$BRANCH" >> $GITHUB_OUTPUT
          echo "Selected branch: $BRANCH"

      - name: Checkout Reference OAM
        uses: actions/checkout@v4
        with:
          repository: openknx/${{ matrix.variant }}
          ref: ${{ steps.oam_branch.outputs.ref_name }}
          path: ${{ matrix.variant }}

      # - name: DEBUG paths
      #   run: |
      #     pwd
      #     find

      - name: Restore OAM
        shell: pwsh
        run: |
          cd ${{ matrix.variant }}/restore 
          ./Restore-Dependencies.ps1

      - name: Restore Current OFM Commit
        uses: actions/checkout@v4
        with:
          # ref: ${{ github.ref_name }}
          path: OFM-DFA

      - name: Download OpenKNXproducer 3.7.14.0 and Verify
        run: |
          mkdir OpenKNXproducer
          cd OpenKNXproducer
          echo '40e30f59deb949704c3ec21e26b3fceb18b418a46443d904383bf4fd99d56461d1d8c39fac756de09079004469d1e868ce33c50768dbe1e3314b304a6fc20c2f *OpenKNXproducer-3.7.14.0.zip' > OpenKNXproducer.checksum
          wget -q https://github.com/OpenKNX/OpenKNXproducer/releases/download/v3.7.14/OpenKNXproducer-3.7.14.0.zip
          sha512sum OpenKNXproducer-3.7.14.0.zip
          sha512sum -c OpenKNXproducer.checksum
      - name: Unzip OpenKNXproducer and Make Executable
        run: |
          cd OpenKNXproducer
          unzip OpenKNXproducer-3.7.14.0.zip || test -f tools/Linux/OpenKNXproducer
          chmod u+x tools/Linux/OpenKNXproducer
      - name: Check OpenKNXproducer
        run: OpenKNXproducer/tools/Linux/OpenKNXproducer version || echo Ignore OpenKNXproducer always returning 1...

      - name: Install OpenKNXproducer
        run: cp -av OpenKNXproducer/tools/Linux/OpenKNXproducer /usr/local/bin/OpenKNXproducer

      - name: Create knxprod
        run: |
          cd ${{ matrix.variant }}
          OpenKNXproducer create --Debug -h include/knxprod.h src/${{ matrix.knxprod_xml }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          virtualenv ~/.platformio/penv
          source ~/.platformio/penv/bin/activate
          pip install platformio          

      - name: OpenKNX Release Build
        if: ${{ matrix.build_target != '#' }}
        run: |
          cd ${{ matrix.variant }}
          pwsh ./scripts/Build-Release.ps1 ${{ matrix.build_target }}

      - name: Show Changed Files
        run: |
          cd ${{ matrix.variant }}
          git diff
